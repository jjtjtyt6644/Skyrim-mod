<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:" />
  <title>Dovah Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="embers" aria-hidden="true"></canvas>

  <!-- Boot splash -->
  <div id="splash">
    <div class="rune-ring"><div class="rune-ring inner"></div></div>
    <div class="splash-title">DOVAH<span>TRAINER</span></div>
    <div class="splash-bar"><i></i></div>
  </div>

  <header id="titlebar">
    <div class="brand"><svg class="logo" viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>DOVAH</span><b>TRAINER</b><em>Skyrim SE</em></div>
    <div class="drag"></div>
    <button id="update-pill" class="update-pill" hidden><i class="fill"></i><span></span></button>
    <div id="status" class="status off"><i></i><span>Searching for Skyrim…</span></div>
    <div class="winctl">
      <button data-win="min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
      <button data-win="close" class="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="m3 3 6 6M9 3 3 9"/></svg></button>
    </div>
  </header>

  <div id="shell">
    <nav id="sidebar">
      <div id="nav-indicator"></div>
      <div id="nav"></div>
      <div class="side-foot">
        <button id="reset-all" class="ghost">Turn off all toggles</button>
        <div class="active-count"><b id="active-count">0</b> cheats active</div>
      </div>
    </nav>

    <main id="content">
      <div id="page"></div>
    </main>

    <aside id="log">
      <h3>Activity</h3>
      <ol id="log-list"></ol>
    </aside>
  </div>

  <div id="toasts"></div>

  <script src="icons.js"></script>
  <script src="cheats.js"></script>
  <script src="app.js"></script>
</body>
</html>
